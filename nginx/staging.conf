# Nodex STAGING (LAN only, http://192.168.0.14:3231): same as default.conf, but the API goes to the
# staging ln-directory (:3222, own state, copy of the directory) and the page is not indexed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    charset utf-8;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Lightning API of the mempool backend: GET only, nothing else of the backend is exposed.
    # The name is looked up again (Docker's DNS, 30 s): a recreated mempool-api gets a new IP and
    # a name resolved once at start kept pointing at the old one (502s from 13 to 16 Oct 2026).
    # With a variable the request's URI goes through unchanged, which is the same path.
    location /api/v1/lightning/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mempool_api mempool-api;
        proxy_pass http://$mempool_api:8999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # ln-directory (operator cards + log-in-with-your-node), same-origin for a future embedded editor.
    # Writes still need ln-directory to accept https://nodex.kilombino.com in ALLOWED_ORIGINS.
    location /api/ln-directory/ {
        proxy_pass http://192.168.0.14:3222/api/ln-directory/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        # ln-directory trusts this header only from Docker networks: per-visitor rate limits.
        proxy_set_header X-LnDir-Client $remote_addr;
        proxy_read_timeout 30s;
    }

    # Operator directory JSON (same file mempool-web serves, mounted read-only).
    location = /resources/lightning-directory.json {
        alias /srv/lndir/lightning-directory.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Indexer output (graph snapshot + policy history). Internal state files are not served.
    location /data/ {
        alias /srv/data/;
        location ~ ^/data/(graph|history|status|uptime|lnd-fees|watchtowers)\.json$ {
            default_type application/json;
            add_header Cache-Control "public, max-age=60" always;
            add_header X-Content-Type-Options nosniff always;
        }
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /favicon.svg { add_header Cache-Control "public, max-age=86400" always; }
    location = /robots.txt { }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
