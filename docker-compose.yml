# Nodex - Lightning explorer for the XBT (Bitcoin BLAKE2b) network.
# Joins the mempool-deploy network (read-only use of mempool-api); nothing of mempool is modified.
name: nodex
services:
  web:
    image: nginx:1.27-alpine
    container_name: nodex-web
    restart: always
    ports:
      - "127.0.0.1:3230:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
      - ./data:/srv/data:ro
      - ../mempool-deploy/lightning-directory:/srv/lndir:ro
    networks: [mempool]
    cpus: 1
    mem_limit: 128m

  indexer:
    image: node:22-slim
    container_name: nodex-indexer
    restart: always
    user: "1000:1000"
    working_dir: /app
    command: ["nice", "-n", "10", "node", "/app/indexer.mjs"]
    environment:
      API_BASE: http://mempool-api:8999/api/v1/lightning
      DATA_DIR: /data
      INTERVAL_SECONDS: "600"
      CONCURRENCY: "3"
    volumes:
      - ./indexer:/app:ro
      - ./data:/data
    networks: [mempool]
    cpus: 1
    mem_limit: 256m

networks:
  mempool:
    external: true
    name: mempool-deploy_default
